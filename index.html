<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Pending Orders Control Tower</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; background: #fff; padding: 15px; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
        .card { background: #fff; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; }
        .card-num { font-size: 28px; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        th { background: #1e293b; color: #fff; padding: 12px; text-align: left; font-size: 12px; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 13px; }
        .sla-breach { color: red; font-weight: bold; background: #ffe6e6; padding: 3px 6px; border-radius: 4px; }
        .sla-ok { color: green; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚡ Live Pending Orders Control Tower (SLA Sorted)</h2>
        <span style="color: green; font-weight: bold;">● Live Sync Active</span>
    </div>

    <div class="grid">
        <div class="card">ACTIVE PENDING<div class="card-num" id="c-total">0</div></div>
        <div class="card">PENDING PICKING<div class="card-num" id="c-pick" style="color:orange;">0</div></div>
        <div class="card">PENDING PACKING<div class="card-num" id="c-pack" style="color:red;">0</div></div>
        <div class="card">PENDING MANIFEST<div class="card-num" id="c-mani" style="color:blue;">0</div></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>SLA STATUS / TIME</th>
                <th>CHANNEL NAME</th>
                <th>ORDER NUMBER / ID</th>
                <th>BATCH NUMBER</th>
                <th>PRODUCT INFO / SKU</th>
                <th>CURRENT STATUS</th>
            </tr>
        </thead>
        <tbody id="tb">
            <tr><td colspan="6" style="text-align:center;">Syncing live data...</td></tr>
        </tbody>
    </table>

    <script>
        function checkData() {
            if (typeof chrome !== "undefined" && chrome.storage) {
                chrome.storage.local.get(["LIVE_BT_DATA"], function(res) {
                    render(res.LIVE_BT_DATA || []);
                });
            }
        }

        window.addEventListener("message", function(e) {
            if (e.data && e.data.type === "BT_DATA_UPDATE") render(e.data.data);
        });

        function render(data) {
            if (!data || data.length === 0) return;
            let total = data.length, pick = 0, pack = 0, mani = 0;
            let html = "";

            data.forEach(o => {
                if (o.status.includes("PICKING")) pick++;
                if (o.status.includes("PACKING")) pack++;
                if (o.status.includes("MANIFEST")) mani++;

                let slaCls = o.sla_text.includes("BREACHED") ? "sla-breach" : "sla-ok";

                html += `<tr>
                    <td><span class="${slaCls}">${o.sla_text}</span></td>
                    <td><b>${o.channel}</b></td>
                    <td><b>${o.order_id}</b></td>
                    <td>${o.batch_no}</td>
                    <td>${o.sku}</td>
                    <td><b>${o.status}</b></td>
                </tr>`;
            });

            document.getElementById("c-total").innerText = total;
            document.getElementById("c-pick").innerText = pick;
            document.getElementById("c-pack").innerText = pack;
            document.getElementById("c-mani").innerText = mani;
            document.getElementById("tb").innerHTML = html;
        }

        setInterval(checkData, 1000);
    </script>
</body>
</html>
