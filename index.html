<script>
    window.addEventListener("message", function(e) {
        if (e.data && e.data.type === "BT_DUAL_SYNC") {
            renderShipments(e.data.shipments);
            renderOrders(e.data.orders);
        }
    });

    function renderShipments(data) {
        // Filter out fully manifested items dynamically
        let activeData = data.filter(s => !(s.total > 0 && s.total === s.manifest) && !(s.packing === 0 && s.packed === 0 && s.manifest > 0));

        if (!activeData || activeData.length === 0) {
            document.getElementById("tb-shipments").innerHTML = `<tr><td colspan="7" style="text-align:center; padding:15px; color:#4ade80;">🎉 All Batches Manifested & Cleared!</td></tr>`;
            document.getElementById("sum-total").innerText = 0;
            document.getElementById("sum-packing").innerText = 0;
            document.getElementById("sum-packed").innerText = 0;
            document.getElementById("sum-manifest").innerText = 0;
            return;
        }

        let html = "";
        let tTotal = 0, tPacking = 0, tPacked = 0, tManifest = 0;

        activeData.forEach(s => {
            let badge = s.channel === "Myntra" ? "badge-myntra" : (s.channel === "Flipkart" ? "badge-fk" : "badge-sp");
            
            tTotal += s.total;
            tPacking += s.packing;
            tPacked += s.packed;
            tManifest += s.manifest;

            html += `<tr>
                <td><span class="${badge}">${s.channel}</span></td>
                <td><b>${s.batch_no}</b></td>
                <td><b>${s.total}</b></td>
                <td><span class="st-packing">${s.packing}</span></td>
                <td><span class="st-packed">${s.packed}</span></td>
                <td><span class="st-manifest">${s.manifest}</span></td>
                <td>${s.others}</td>
            </tr>`;
        });

        document.getElementById("tb-shipments").innerHTML = html;
        document.getElementById("sum-total").innerText = tTotal;
        document.getElementById("sum-packing").innerText = tPacking;
        document.getElementById("sum-packed").innerText = tPacked;
        document.getElementById("sum-manifest").innerText = tManifest;
    }

    function renderOrders(data) {
        if (!data || data.length === 0) {
            document.getElementById("tb-orders").innerHTML = `<tr><td colspan="4" style="text-align:center; padding:15px; color:#4ade80;">🎉 No Pending Orders!</td></tr>`;
            return;
        }

        let html = "";
        data.forEach(o => {
            let badge = o.channel === "Myntra" ? "badge-myntra" : (o.channel === "Flipkart" ? "badge-fk" : "badge-sp");
            html += `<tr>
                <td><b>${o.order_id}</b></td>
                <td><span class="${badge}">${o.channel}</span></td>
                <td><code>${o.sku}</code></td>
                <td><span class="sla-urgent">${o.sla_text}</span></td>
            </tr>`;
        });
        document.getElementById("tb-orders").innerHTML = html;
    }
</script>
